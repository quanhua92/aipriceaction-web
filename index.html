<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIPriceAction</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Vietnamese stock market analysis and trading insights powered by AI" />

    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AIPriceAction" />
    <meta name="application-name" content="AIPriceAction" />

    <!-- Icons -->
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo-16.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
      <link rel="mask-icon" href="/logo.svg" color="#000000" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <script type="text/javascript">
      // Vite replaces import.meta.env.VITE_GA_MEASUREMENT_ID at build time
      window.GA_MEASUREMENT_ID = '${import.meta.env.VITE_GA_MEASUREMENT_ID || ''}';

      if (window.GA_MEASUREMENT_ID && window.GA_MEASUREMENT_ID !== '' && !window.GA_MEASUREMENT_ID.includes('undefined')) {
        // Google tag (gtag.js)
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', window.GA_MEASUREMENT_ID);

        // Load gtag script
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.GA_MEASUREMENT_ID;
        document.head.appendChild(script);
      }
    </script>
    <script>
      // Prevent FOUC by applying theme immediately
      (function() {
        var root = document.documentElement;
        var theme = 'system'; // default fallback

        try {
          // Test if localStorage is available
          var test = '__test__';
          localStorage.setItem(test, test);
          localStorage.removeItem(test);

          // If localStorage works, get the theme
          var storedTheme = localStorage.getItem('site-settings-theme');
          if (storedTheme && ['light', 'dark', 'system'].indexOf(storedTheme) !== -1) {
            theme = storedTheme;
          }
        } catch (e) {
          // localStorage not available, keep default 'system' theme
          console.log('localStorage not available, using system theme');
        }

        // Apply the theme
        if (theme === 'system') {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.add(isDark ? 'dark' : 'light');
        } else {
          root.classList.add(theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
